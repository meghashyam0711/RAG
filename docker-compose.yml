# Optional production backends. The MCP server works without these (embedded Qdrant + NetworkX).
# Start:  docker compose up -d
# Then:   export QDRANT_URL=http://localhost:6333 NEO4J_URI=bolt://localhost:7687 NEO4J_PASSWORD=graphrag-dev
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/graphrag-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    volumes: ["neo4j_data:/data"]
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
