# Optional production backends. The MCP server works without these (embedded Qdrant + NetworkX).
# Start:  docker compose up -d
# Then:   export QDRANT_URL=http://localhost:6333 NEO4J_URI=bolt://localhost:7687 NEO4J_PASSWORD=graphrag-dev
#
# Ports are published on 127.0.0.1 only: neither service is authenticated here
# (Qdrant has no API key, Neo4j uses the dev password below), so do not expose
# them beyond this machine. For anything but local development, set a real
# NEO4J_AUTH password and a QDRANT__SERVICE__API_KEY first.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/graphrag-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    volumes: ["neo4j_data:/data"]
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
