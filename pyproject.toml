[project]
name = "self-corrective-graphrag"
version = "0.1.0"
description = "Layout-aware, self-correcting GraphRAG exposed as an MCP server for Claude Code, Cursor, Windsurf and any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "langgraph>=0.3",
    "qdrant-client>=1.12",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
    "networkx>=3.2",
    "pypdf>=4.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
# Layout-aware PDF parsing (multi-column reading order, intact tables). Strongly recommended for PDFs.
docling = ["docling>=2.0"]
# Real neural embeddings + BM25 tokenisation (downloads ONNX models on first use).
embeddings = ["fastembed>=0.4"]
# Cross-encoder reranker (BAAI/bge-reranker-v2-m3).
rerank = ["sentence-transformers>=3.0"]
# Production graph store.
neo4j = ["neo4j>=5.20"]
# LLM providers for extraction / grading / generation (all optional).
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
eval = ["datasets>=2.20"]
all = [
    "self-corrective-graphrag[docling,embeddings,rerank,neo4j,anthropic,openai,eval]",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
graphrag-mcp = "graphrag.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"
